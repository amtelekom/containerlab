# Regression topology for the destroy-by-name leak: the "extra" node only
# exists when the includeExtra template variable is set. A destroy run that
# parses this topology without --vars sees a reduced node set and must still
# remove the leftover container labelled with the lab name.
name: leak-regression

topology:
  nodes:
    n1:
      kind: linux
      image: alpine:latest
    {{ if .includeExtra }}
    extra:
      kind: linux
      image: alpine:latest
    {{ end }}
